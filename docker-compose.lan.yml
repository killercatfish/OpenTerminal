# LAN only, on the host it runs on (planned: tradepi, the Pi beside the trading bots):
#   docker compose -f docker-compose.yml -f docker-compose.lan.yml up -d --build
#
# - web is published on this host's LAN address only (LAN_BIND), so Tailscale peers and the
#   internet can't reach it. Docker-published ports bypass ufw, so this bind IS the boundary.
# - api stays on 127.0.0.1:4000 (from docker-compose.yml); the browser never calls it directly,
#   the web container proxies to it over the compose network with API_KEY attached.
# - ./.env (git-ignored) sets all three, explicitly:
#     LAN_BIND=<this host's reserved LAN address>
#     API_KEY=<openssl rand -hex 32>
#     WEB_ORIGIN=http://<LAN_BIND>:3000
# - Alpaca keys go to the api container only, from ./alpaca.env (git-ignored, chmod 600), with the
#   trading bot's variable names: ALPACA_KEY, ALPACA_SECRET, ALPACA_PAPER=true.
#   Use a copy of one paper bot's key; never point this at /opt/trading (the trader user's files).
services:
  api:
    env_file:
      - ./alpaca.env
  web:
    ports:
      - "${LAN_BIND:?set LAN_BIND in .env}:3000:3000"
